<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recape Bauru — Acompanhamento de Obras</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --azul:#1F4E78; --cinza:#9e9e9e; --amarelo:#f5b301; --verde:#2e7d32;
    --bg:#f4f6f8; --card:#ffffff; --txt:#1c2733; --muted:#667085; --line:#e4e8ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:1000}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  header .sub{font-size:12px;opacity:.8;margin-top:2px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
  .stat{background:rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;text-align:center;min-width:70px}
  .stat b{display:block;font-size:16px;line-height:1.1}
  .stat span{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
  #main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0}
  /* Sidebar */
  #side{width:340px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .toolbar{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .toolbar input,.toolbar select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)}
  .filtchips{display:flex;gap:6px}
  .chip{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 4px;font-size:11.5px;cursor:pointer;text-align:center;user-select:none;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip.off{opacity:.4}
  .chip.active{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul)}
  .listwrap{flex:1;overflow:auto}
  .row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px;align-items:flex-start}
  .row:hover{background:#f7fafd}
  .row.sel{background:#eef4fb}
  .row .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
  .row .rt{flex:1;min-width:0}
  .row .rn{font-size:12.5px;font-weight:600;line-height:1.25}
  .row .rb{font-size:11px;color:var(--muted);margin-top:2px}
  .row .rpct{font-size:11px;color:var(--muted);margin-top:3px}
  .prog{height:5px;background:#eceff3;border-radius:3px;margin-top:4px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--verde)}
  .nomap{font-size:9.5px;color:#b26a00;background:#fff4e0;border-radius:4px;padding:1px 5px;margin-top:3px;display:inline-block}
  /* Detail panel */
  #detail{position:absolute;left:12px;bottom:12px;width:330px;max-width:calc(100% - 24px);background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.22);z-index:1200;overflow:hidden;display:none}
  #detail .dh{padding:12px 14px;color:#fff;position:relative}
  #detail .dh .dclose{position:absolute;top:8px;right:10px;cursor:pointer;font-size:18px;opacity:.9;line-height:1}
  #detail .dh h3{margin:0;font-size:14px;line-height:1.3;padding-right:18px}
  #detail .dh .dstatus{font-size:11.5px;margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.95}
  #detail .db{padding:6px 14px 14px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--muted)}
  .kv b{text-align:right}
  .bigprog{height:9px;background:#eceff3;border-radius:5px;margin:8px 0 2px;overflow:hidden}
  .bigprog>i{display:block;height:100%}
  /* Legend */
  .legend{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.2);font-size:12px;line-height:1.9}
  .legend .li{display:flex;align-items:center;gap:7px}
  .legend .dot{width:12px;height:4px;border-radius:2px}
  .banner{background:#fff4e0;color:#8a5a00;font-size:12px;padding:7px 12px;text-align:center;border-bottom:1px solid #f0dcae}
  .btn{background:#fff;color:var(--azul);border:0;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:#eef4fb}
  #filerow{display:none}
  @media(max-width:820px){
    #side{width:100%;position:absolute;right:0;top:0;bottom:0;transform:translateX(100%);transition:.25s;z-index:1500}
    #side.open{transform:none}
    .stats{width:100%;margin-left:0}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>🚧 Recape Bauru — Painel de Obras</h1>
      <div class="sub" id="subttl">Carregando dados…</div>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="btnReload" title="Reler a planilha">↻ Atualizar</button>
  </header>
  <div class="banner" id="banner" style="display:none"></div>
  <div id="filerow" class="banner">
    Não consegui ler a planilha automaticamente. Selecione o arquivo <b>Ruas de Bauru.xlsx</b>:
    &nbsp;<input type="file" id="fileInput" accept=".xlsx">
  </div>
  <div id="main">
    <div id="map"></div>
    <aside id="side">
      <div class="toolbar">
        <input id="search" placeholder="🔎 Buscar rua…">
        <select id="bairro"><option value="">Todos os bairros</option></select>
        <div class="filtchips" id="chips"></div>
      </div>
      <div class="listwrap"><div id="list"></div></div>
    </aside>
  </div>
</div>
<div id="detail"></div>

<script src="geodata.js"></script>
<script src="dados_snapshot.js"></script>
<script>
const XLSX_FILE = "Ruas de Bauru.xlsx";
const STATUS = {
  nova:       {key:"nova",       label:"Não iniciada",          color:"#9e9e9e"},
  andamento:  {key:"andamento",  label:"Em andamento",          color:"#f5b301"},
  final:      {key:"final",      label:"Finalizada",            color:"#2e7d32"},
  paralisada: {key:"paralisada", label:"Paralisada / não será feita", color:"#c62828"},
};
const BRL = v => (v==null||v==="")?"—":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = v => (v==null||v==="")?"—":Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const PCT = v => (v==null||v==="")?"0%":Math.round(Number(v)*100)+"%";

// ---- normalização de nome de rua (igual à do processamento) ----
function norm(s){
  s=(s==null?"":String(s));
  s=s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
  s=s.replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  return s;
}
const TIPOS=/^(RUA|AVENIDA|AV|ALAMEDA|AL|TRAVESSA|TREVESSA|PRACA|ROD|RODOVIA|R)\s+/;
function streetname(name){
  let n=norm(name);
  n=n.replace(/^LINHA\s*\d+/,"").trim();
  n=n.replace(TIPOS,"").replace(TIPOS,"");
  n=n.replace(/\bQT\b.*$/,"");
  const toks=n.split(" ").filter(Boolean); const out=[];
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(/^\d+$/.test(t)) break;
    if(["A","E","AO","AS","OS"].includes(t) && i>0 && toks.slice(i).some(x=>/\d/.test(x))) break;
    out.push(t);
  }
  return out.join(" ").trim() || n;
}
// extrai o trecho da via (ex: "QT 01 A 03") para diferenciar pedaços da mesma rua
function qtOf(name){
  const n=norm(name);
  const m=n.match(/\bQT\b.*$/);
  return m ? m[0].trim() : "";
}
function statusOf(raw){
  const s=norm(raw);
  if(!s) return "nova";
  if(s.includes("PARALIS")||s.includes("NAO SERA")||s.includes("CANCELAD")||s.includes("SUSPENS")) return "paralisada";
  if(s.includes("NAO INIC")||s.includes("A INICIAR")||s.includes("PENDENTE")) return "nova";
  if(s.includes("FINALIZ")||s.includes("CONCLU")||s.includes("ENCERRAD")) return "final";
  if(s.includes("ANDAMENTO")||s.includes("EXECU")||s.includes("INICIAD")||s.includes("EM OBRA")) return "andamento";
  return "nova";
}

// ---- mapa ----
const map=L.map("map",{zoomControl:true,preferCanvas:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, attribution:"© OpenStreetMap"
}).addTo(map);
map.fitBounds(GEO.bbox);
// limite do município
L.polygon(GEO.municipio,{color:"#1F4E78",weight:1.5,fill:false,dashArray:"4 5",interactive:false}).addTo(map);

// legenda
const lg=L.control({position:"bottomright"});
lg.onAdd=function(){const d=L.DomUtil.create("div","legend");
  d.innerHTML="<b>Status da obra</b><br>"+Object.values(STATUS).map(s=>
    `<div class="li"><span class="dot" style="background:${s.color};height:5px"></span>${s.label}</div>`).join("");
  return d;};
lg.addTo(map);

// ALIAS xlsx->kml
const ALIAS=GEO.alias||{};
let RUAS=[];            // dados unificados
let LABELS={medido:"Valor medido", aMedir:"Valor a medir"}; // rótulos = cabeçalho real da planilha
let layerIndex={};      // item -> {layers:[]}
let selItem=null;
let filt={status:{nova:true,andamento:true,final:true,paralisada:true}, bairro:"", q:""};

function colorFor(item){ return STATUS[item.status].color; }

function drawAll(){
  Object.values(layerIndex).forEach(o=>o.layers.forEach(l=>map.removeLayer(l)));
  layerIndex={};
  RUAS.forEach(r=>{
    if(!r.geo) return;
    const layers=[];
    r.geo.segments.forEach(seg=>{
      const pl=L.polyline(seg,{color:colorFor(r),weight:6,opacity:.9,lineCap:"round"});
      pl.on("mouseover",()=>{ highlight(r,true); showTip(r,pl); });
      pl.on("mouseout",()=>{ if(selItem!==r.item) highlight(r,false); map.closePopup(); });
      pl.on("click",()=>selectRua(r,true));
      pl.addTo(map); layers.push(pl);
    });
    layerIndex[r.item]={layers};
  });
  applyFilter();
}
function showTip(r,layer){
  const c=r.geo.center;
  L.popup({closeButton:false,autoPan:false,className:"tip"})
    .setLatLng(c).setContent(`<b>${r.via}</b><br><span style="color:${STATUS[r.status].color}">●</span> ${STATUS[r.status].label} — ${PCT(r.pct)}`)
    .openOn(map);
}
function highlight(r,on){
  const o=layerIndex[r.item]; if(!o)return;
  o.layers.forEach(l=>l.setStyle({weight:on?10:6,opacity:on?1:.9}));
  if(on) o.layers.forEach(l=>l.bringToFront());
}

// ---- painel de detalhe ----
function selectRua(r,fromMap){
  selItem=r.item;
  RUAS.forEach(x=>highlight(x,false));
  highlight(r,true);
  document.querySelectorAll(".row").forEach(el=>el.classList.toggle("sel",el.dataset.item==r.item));
  const sel=document.querySelector(`.row[data-item='${r.item}']`);
  if(sel) sel.scrollIntoView({block:"nearest"});
  const s=STATUS[r.status];
  const est=r.estimado, med=r.medido, ame=r.aMedir;
  const d=document.getElementById("detail");
  d.style.display="block";
  d.innerHTML=`
    <div class="dh" style="background:${s.color}">
      <span class="dclose" onclick="document.getElementById('detail').style.display='none'">×</span>
      <h3>${r.via}</h3>
      <div class="dstatus">${s.label} · ${PCT(r.pct)} concluído</div>
    </div>
    <div class="db">
      <div class="bigprog"><i style="width:${Math.min(100,Math.round((r.pct||0)*100))}%;background:${s.color}"></i></div>
      <div class="kv"><span>Bairro</span><b>${r.bairro||"—"}</b></div>
      <div class="kv"><span>Prazo</span><b>${r.prazo||"—"}</b></div>
      <div class="kv"><span>Início</span><b>${r.inicio||"—"}</b></div>
      <div class="kv"><span>Término</span><b>${r.fim||"—"}</b></div>
      <div class="kv"><span>Área</span><b>${r.area?NUM(r.area)+" m²":"—"}</b></div>
      <div class="kv"><span>Valor estimado</span><b>${BRL(est)}</b></div>
      <div class="kv"><span>${LABELS.medido}</span><b>${BRL(med)}</b></div>
      <div class="kv"><span>${LABELS.aMedir}</span><b>${BRL(ame)}</b></div>
      ${r.geo?"":'<div class="kv"><span></span><b style="color:#b26a00">⚠ Sem traçado no mapa</b></div>'}
    </div>`;
  if(fromMap && r.geo){ map.panTo(r.geo.center); }
  else if(r.geo){ map.fitBounds(L.polyline(r.geo.segments.flat()).getBounds(),{maxZoom:17,padding:[60,60]}); }
}

// ---- lista lateral ----
function renderList(){
  const box=document.getElementById("list");
  const rs=RUAS.filter(passFilter);
  box.innerHTML = rs.length? rs.map(r=>{
    const s=STATUS[r.status];
    return `<div class="row" data-item="${r.item}">
      <div class="bar" style="background:${s.color}"></div>
      <div class="rt">
        <div class="rn">${r.via}</div>
        <div class="rb">${r.bairro||""}</div>
        <div class="prog"><i style="width:${Math.min(100,Math.round((r.pct||0)*100))}%;background:${s.color}"></i></div>
        <div class="rpct">${s.label} · ${PCT(r.pct)}${r.estimado?" · "+BRL(r.estimado):""}</div>
        ${r.geo?"":'<span class="nomap">sem traçado no mapa</span>'}
      </div></div>`;
  }).join("") : '<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center">Nenhuma rua encontrada.</div>';
  box.querySelectorAll(".row").forEach(el=>{
    const r=RUAS.find(x=>x.item==el.dataset.item);
    el.onclick=()=>selectRua(r,false);
    el.onmouseenter=()=>highlight(r,true);
    el.onmouseleave=()=>{ if(selItem!==r.item) highlight(r,false); };
  });
}
function passFilter(r){
  if(!filt.status[r.status]) return false;
  if(filt.bairro && r.bairro!==filt.bairro) return false;
  if(filt.q && !norm(r.via).includes(norm(filt.q)) && !norm(r.bairro).includes(norm(filt.q))) return false;
  return true;
}
function applyFilter(){
  RUAS.forEach(r=>{
    const o=layerIndex[r.item]; if(!o)return;
    const show=passFilter(r);
    o.layers.forEach(l=>{ if(show){ if(!map.hasLayer(l))l.addTo(map);} else map.removeLayer(l); });
  });
  renderList();
}

// ---- resumo ----
function renderStats(){
  const c={nova:0,andamento:0,final:0,paralisada:0};
  let area=0,est=0,med=0,ame=0;
  RUAS.forEach(r=>{c[r.status]++; area+=r.area||0; est+=r.estimado||0; med+=r.medido||0; ame+=r.aMedir||0;});
  const pctGeral = est>0 ? med/est : 0;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><b>${RUAS.length}</b><span>Ruas</span></div>
    <div class="stat"><b style="color:#ffd7d7">${c.nova}</b><span>Não inic.</span></div>
    <div class="stat"><b style="color:#ffe9a8">${c.andamento}</b><span>Andamento</span></div>
    <div class="stat"><b style="color:#bff0c0">${c.final}</b><span>Finaliz.</span></div>
    <div class="stat"><b style="color:#ffc7c7">${c.paralisada}</b><span>Paralisada</span></div>
    <div class="stat"><b>${Math.round(pctGeral*100)}%</b><span>Medido/Est.</span></div>`;
  document.getElementById("subttl").innerHTML=
    `Área total: ${area?NUM(area)+" m²":"—"} · Estimado: ${BRL(est)} · ${LABELS.medido}: ${BRL(med)} · ${LABELS.aMedir}: ${BRL(ame)}`;
}

// ---- construção dos dados a partir das linhas da planilha ----
function buildFromRows(rows){
  const H=rows[0].map(h=>norm(h));
  const find=(...kw)=>H.findIndex(h=>kw.every(k=>h.includes(k)));
  const idx={
    item:find("ITEM"), bairro:find("BAIRRO"), via:(find("NOME","VIA")>=0?find("NOME","VIA"):find("VIA")),
    prazo:find("PRAZO"), status:find("STATUS"),
    inicio:(find("INICIO")>=0?find("INICIO"):find("DATA","INIC")),
    fim:(find("TERMINO")>=0?find("TERMINO"):find("FIM")),
    area:find("AREA"), estimado:find("ESTIMAD"),
    pct:(find("CONCLUID")>=0?find("CONCLUID"):find("CONCLU")),
    medir:find("MEDIR"), medido:-1
  };
  idx.medido = H.findIndex(h=>h.includes("MEDIDO"));
  if(idx.medido<0) idx.medido = H.findIndex(h=>h.includes("VALOR") && !h.includes("ESTIMAD") && !h.includes("MEDIR"));
  if(idx.medir<0) idx.medir = H.findIndex(h=>h.includes("SALDO"));
  LABELS.medido = idx.medido>=0 ? String(rows[0][idx.medido]).trim() : "Valor medido";
  LABELS.aMedir = idx.medir>=0 ? String(rows[0][idx.medir]).trim() : "Valor a medir";
  const g=(r,i)=> (i>=0 && i<r.length)? r[i] : null;
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r || g(r,idx.via)==null || String(g(r,idx.via)).trim()==="") continue;
    const via=String(g(r,idx.via)).trim();
    let pct=g(r,idx.pct); pct=pct==null||pct===""?0:Number(pct); if(pct>1) pct=pct/100;
    const est=numOrNull(g(r,idx.estimado));
    let med=numOrNull(g(r,idx.medido));
    if(med==null && est!=null) med=est*(pct||0);
    let ame=numOrNull(g(r,idx.medir));
    if(ame==null && est!=null) ame=est-(med||0);
    let sk=streetname(via); if(ALIAS[sk]) sk=ALIAS[sk];
    const rec={
      item:g(r,idx.item)!=null?g(r,idx.item):i,
      via, bairro:g(r,idx.bairro)||"", prazo:g(r,idx.prazo)||"",
      status:statusOf(g(r,idx.status)),
      inicio:fmtDate(g(r,idx.inicio)), fim:fmtDate(g(r,idx.fim)),
      area:numOrNull(g(r,idx.area)), estimado:est, medido:med, aMedir:ame,
      pct:pct||0, sk, geo:null
    };
    out.push(rec);
  }
  assignGeo(out);
  return out;
}
// quando várias linhas da planilha caem na mesma rua (ex: trechos/quadras
// diferentes), tenta dar a cada linha só o pedaço do traçado que é dela,
// casando pelo texto da quadra ("QT ..."). Se não der pra separar com
// segurança, todas ficam com o traçado inteiro (comportamento antigo).
function assignGeo(list){
  const bySk={};
  list.forEach(r=>{ (bySk[r.sk]=bySk[r.sk]||[]).push(r); });
  Object.keys(bySk).forEach(sk=>{
    const group=bySk[sk], base=GEO.geo[sk];
    if(!base) return;
    if(group.length===1){ group[0].geo=base; return; }
    const segs=base.segments, names=base.kml_names||[];
    const claimed=new Array(segs.length).fill(false);
    let allMatched=true;
    group.forEach(r=>{
      const q=qtOf(r.via); r._idx=[];
      if(q) names.forEach((nm,i)=>{ if(!claimed[i] && qtOf(nm)===q){ r._idx.push(i); claimed[i]=true; } });
      if(r._idx.length===0) allMatched=false;
    });
    if(allMatched && claimed.every(Boolean)){
      group.forEach(r=>{
        const mySegs=r._idx.map(i=>segs[i]);
        const allp=mySegs.flat();
        const lat=allp.reduce((s,p)=>s+p[0],0)/allp.length;
        const lon=allp.reduce((s,p)=>s+p[1],0)/allp.length;
        r.geo={segments:mySegs, kml_names:r._idx.map(i=>names[i]), center:[lat,lon]};
      });
    } else {
      group.forEach(r=>{ r.geo=base; });
    }
    group.forEach(r=>delete r._idx);
  });
}
function numOrNull(v){ if(v==null||v==="")return null; const n=Number(v); return isNaN(n)?null:n; }
function fmtDate(v){
  if(v==null||v==="")return "";
  if(typeof v==="number"){
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d)) return d.toLocaleDateString("pt-BR",{timeZone:"UTC"});
  }
  const d=new Date(v); if(!isNaN(d) && String(v).match(/\d{4}/)) return d.toLocaleDateString("pt-BR");
  return String(v);
}

// ---- filtros UI ----
function initFilters(){
  const chips=document.getElementById("chips");
  chips.innerHTML=Object.values(STATUS).map(s=>
    `<div class="chip active" data-s="${s.key}"><span class="dot" style="background:${s.color}"></span>${s.label}</div>`).join("");
  chips.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const k=ch.dataset.s; filt.status[k]=!filt.status[k];
    ch.classList.toggle("off",!filt.status[k]); ch.classList.toggle("active",filt.status[k]);
    applyFilter(); renderStats();
  });
  const bs=[...new Set(RUAS.map(r=>r.bairro).filter(Boolean))].sort();
  const bsel=document.getElementById("bairro");
  bsel.innerHTML='<option value="">Todos os bairros</option>'+bs.map(b=>`<option>${b}</option>`).join("");
  bsel.onchange=()=>{filt.bairro=bsel.value;applyFilter();};
  document.getElementById("search").oninput=e=>{filt.q=e.target.value;applyFilter();};
}

// ---- carregamento ----
function loadRows(rows){
  RUAS=buildFromRows(rows);
  initFilters(); drawAll(); renderStats();
}
function fromSnapshot(){
  if(!window.SNAPSHOT){banner("Não foi possível carregar os dados.");return;}
  const rows=[["Item","Bairro","Nome da Via","Prazo","Status","Data Início","Data Fim","Área (m²)","Valor Estimado (R$)","% Concluído","Valor Medido (R$)","Valor a Medir (R$)"]];
  window.SNAPSHOT.forEach(s=>rows.push([s.item,s.bairro,s.via,s.prazo,"Não iniciada","","","","",0,"",""]));
  loadRows(rows);
}
function banner(msg){const b=document.getElementById("banner");b.style.display="block";b.textContent=msg;}
function parseXlsxArrayBuffer(ab){
  const wb=XLSX.read(ab,{type:"array"});
  const ws=wb.Sheets["PLAN"]||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  return rows;
}
function loadXlsx(){
  fetch(XLSX_FILE,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})
    .then(ab=>{ document.getElementById("banner").style.display="none";
                document.getElementById("filerow").style.display="none";
                loadRows(parseXlsxArrayBuffer(ab)); })
    .catch(()=>{
      document.getElementById("filerow").style.display="block";
      if(RUAS.length===0) fromSnapshot();
    });
}
document.getElementById("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{ document.getElementById("filerow").style.display="none"; loadRows(parseXlsxArrayBuffer(ev.target.result)); };
  rd.readAsArrayBuffer(f);
});
document.getElementById("btnReload").onclick=loadXlsx;

loadXlsx();
</script>
